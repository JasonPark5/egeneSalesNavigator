name = "egenesalesnavigator"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# web/ 정적 파일과 /api/* Worker 로직을 같은 오리진에서 함께 서빙한다.
# 요청 경로가 web/ 안의 실제 파일과 일치하면 Worker를 거치지 않고 자산이 바로 응답하고,
# 일치하는 파일이 없을 때만(=/api/* 전부) 아래 worker/src/index.js의 fetch가 호출된다.
[assets]
directory = "./web"
binding = "ASSETS"

# 시크릿(OPENAI_API_KEY, KAKAO_REST_API_KEY, NAVER_CLIENT_ID/SECRET,
# GOOGLE_CLIENT_SECRET)은 이 파일이 아니라 Cloudflare 대시보드(Worker > Settings >
# Variables and Secrets, 반드시 "Runtime" 쪽에 Type: Secret으로 등록 — "Build"
# 쪽은 빌드 스크립트 전용이라 Worker가 요청 처리할 때 못 읽고, "Text" 타입은
# Git 연동 재배포 때 이 파일에 없는 값이라 초기화되는 걸로 보임)에서 등록합니다.
#
# LLM_PROVIDER처럼 민감하지 않은 값은 대시보드 등록에 기대지 않고 여기(코드,
# 버전관리됨)에 명시해서 재배포로 사라지는 문제를 원천 차단한다.
[vars]
LLM_PROVIDER = "openai"

# 대시보드에서 로그(Observability > Logs)를 켜면 "Update your Wrangler config"
# 경고가 뜬다 — Git 연동 배포(Workers Builds)는 이 파일 기준으로 재배포되므로,
# 대시보드에서 켠 설정이 다음 배포 때 사라지지 않도록 여기에도 명시해둔다.
# (redact_query_string은 대시보드가 보여준 값 그대로였지만, 실제 빌드에서 쓰는
# wrangler 버전이 "Unexpected fields found in observability field"로 거부해서 뺐다.)
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
